<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลอยกระทงออนไลน์ - เทศบาลตำบลพันเสา</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Sarabun & Kanit & Mali -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Mali:wght@400;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            font-family: 'Sarabun', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Kanit', sans-serif;
        }
        .font-handwriting {
            font-family: 'Mali', cursive;
        }

        /* Water & Sky styling */
        .night-sky {
            background: radial-gradient(circle at 75% 20%, #1a224a 0%, #0c1024 60%, #050711 100%);
        }
        .water-surface {
            background: linear-gradient(180deg, rgba(8, 18, 43, 0.9) 0%, rgba(5, 12, 30, 0.98) 50%, rgba(2, 6, 18, 1) 100%);
        }

        /* Realistic Candle Flicker & Glow */
        @keyframes candle-flicker {
            0%, 100% { transform: scale(1) rotate(-1deg); opacity: 0.95; filter: drop-shadow(0 0 8px rgba(255, 180, 50, 0.9)); }
            25% { transform: scale(1.15, 0.9) rotate(2deg); opacity: 0.85; filter: drop-shadow(0 0 14px rgba(255, 140, 20, 1)); }
            50% { transform: scale(0.9, 1.1) rotate(-2deg); opacity: 1; filter: drop-shadow(0 0 10px rgba(255, 200, 80, 0.95)); }
            75% { transform: scale(1.05, 0.95) rotate(1deg); opacity: 0.9; filter: drop-shadow(0 0 16px rgba(255, 160, 40, 1)); }
        }
        .candle-flame {
            animation: candle-flicker 1.8s infinite ease-in-out;
            transform-origin: bottom center;
        }

        /* Moon aura */
        .moon-glow {
            box-shadow: 0 0 50px 15px rgba(255, 250, 205, 0.35), 0 0 120px 40px rgba(255, 235, 160, 0.2);
        }

        /* Water reflection sheen */
        @keyframes river-shimmer {
            0% { transform: translateX(-50%) translateY(0); opacity: 0.4; }
            50% { transform: translateX(0%) translateY(4px); opacity: 0.75; }
            100% { transform: translateX(50%) translateY(0); opacity: 0.4; }
        }
        .shimmer-wave {
            animation: river-shimmer 8s infinite linear alternate;
        }

        /* Smooth scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.5);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(245, 158, 11, 0.8);
        }

        /* OBS transparent mode */
        body.obs-mode {
            background: transparent !important;
        }
        body.obs-mode .bg-night-layer {
            opacity: 0.05 !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen overflow-hidden relative select-none">

    <!-- CANVAS LAYERS -->
    <!-- 1. Starfield & Lanterns & Fireworks Canvas -->
    <canvas id="skyCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- 2. Water Wave Reflections Canvas -->
    <canvas id="waterCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>

    <!-- NIGHT SKY & FULL MOON -->
    <div class="bg-night-layer absolute inset-0 night-sky pointer-events-none -z-10 transition-opacity duration-500"></div>

    <!-- The Full Moon -->
    <div class="absolute top-6 right-8 md:top-12 md:right-28 pointer-events-none z-0 flex flex-col items-center">
        <div class="relative w-24 h-24 md:w-32 md:h-32 rounded-full bg-gradient-to-tr from-amber-100 via-amber-50 to-white moon-glow opacity-95">
            <!-- Subtle moon craters -->
            <div class="absolute top-4 left-6 w-5 h-5 rounded-full bg-amber-200/40 blur-[1px]"></div>
            <div class="absolute bottom-6 right-8 w-8 h-8 rounded-full bg-amber-200/35 blur-[1px]"></div>
            <div class="absolute top-10 right-5 w-4 h-4 rounded-full bg-amber-200/30 blur-[1px]"></div>
        </div>
        <div class="text-[11px] md:text-xs text-amber-200/70 font-light tracking-widest mt-2 flex items-center gap-1">
            <i class="fa-regular fa-moon text-amber-300"></i> วันเพ็ญเดือนสิบสอง
        </div>
    </div>

    <!-- SILHOUETTE TEMPLE & HORIZON RIVERBANK -->
    <div class="absolute left-0 w-full h-44 bottom-1/2 pointer-events-none z-0 opacity-40">
        <!-- Thai Stupa / Pagoda Silhouette -->
        <svg class="absolute bottom-0 left-6 md:left-24 w-32 md:w-56 h-auto fill-slate-900" viewBox="0 0 200 120">
            <path d="M100 0 L103 40 L115 50 L125 70 L145 95 L160 120 L40 120 L55 95 L75 70 L85 50 L97 40 Z"/>
            <path d="M40 90 L30 120 L10 120 L25 90 Z"/>
            <path d="M160 90 L170 120 L190 120 L175 90 Z"/>
        </svg>
        <!-- Floating city glow reflections on horizon -->
        <div class="absolute bottom-0 w-full h-[2px] bg-gradient-to-r from-transparent via-amber-400/40 to-transparent"></div>
    </div>

    <!-- TOP BAR NAVIGATION -->
    <header class="relative z-40 w-full px-4 py-3 md:px-8 md:py-4 flex items-center justify-between backdrop-blur-sm bg-slate-950/30 border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center shadow-lg shadow-amber-500/30 text-slate-950 text-xl font-bold">
                🪷
            </div>
            <div>
                <h1 class="text-base md:text-xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-300 to-amber-400 flex items-center gap-2">
                    ลอยกระทงออนไลน์ 
                    <span class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-normal hidden sm:inline-block">เทศบาลตำบลพันเสา</span>
                </h1>
                <p class="text-[11px] md:text-xs text-slate-300/80">ขอขมาพระแม่คงคา เสริมสิริมงคล</p>
            </div>
        </div>

        <!-- Controls: Audio, Lantern, OBS mode, Count -->
        <div class="flex items-center gap-2 md:gap-3">
            <!-- Krathong Counter -->
            <div class="bg-slate-900/80 border border-amber-500/30 px-3 py-1.5 rounded-full text-xs font-medium text-amber-300 flex items-center gap-1.5 shadow-inner">
                <i class="fa-solid fa-water text-cyan-400"></i>
                <span class="hidden md:inline">กระทงในสายน้ำ:</span>
                <span id="krathongCountBadge" class="font-bold text-yellow-300">0</span>
            </div>

            <!-- Launch Lantern Button -->
            <button id="btnReleaseLantern" title="ปล่อยโคมลอยขึ้นสู่ฟ้า" class="px-3 py-1.5 bg-gradient-to-r from-amber-600 to-orange-500 hover:from-amber-500 hover:to-orange-400 text-white rounded-full text-xs font-medium shadow-md shadow-orange-950/40 transition active:scale-95 flex items-center gap-1.5">
                <i class="fa-solid fa-fire text-yellow-200"></i>
                <span class="hidden sm:inline">ปล่อยโคมลอย</span>
            </button>

            <!-- Sound toggle -->
            <button id="btnToggleSound" title="เปิด/ปิด เสียงคลื่นและดนตรีไทย" class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-slate-900/80 border border-white/20 text-slate-300 hover:text-amber-300 hover:border-amber-400/50 transition flex items-center justify-center text-xs md:text-sm">
                <i id="soundIcon" class="fa-solid fa-volume-xmark"></i>
            </button>

            <!-- OBS / Streamer Transparency Mode -->
            <button id="btnToggleOBS" title="โหมด OBS สำหรับ Live Stream (พื้นหลังโปร่งใส)" class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-slate-900/80 border border-white/20 text-slate-300 hover:text-emerald-400 hover:border-emerald-400/50 transition flex items-center justify-center text-xs md:text-sm">
                <i class="fa-solid fa-video"></i>
            </button>
        </div>
    </header>

    <!-- RIVER CONTAINER (Interactive Krathongs DOM container) -->
    <main id="riverArea" class="relative z-20 w-full h-[calc(100vh-140px)] md:h-[calc(100vh-160px)] overflow-hidden cursor-crosshair">
        <!-- Subtle instruction banner -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 text-[11px] md:text-xs text-amber-200/70 bg-slate-900/60 backdrop-blur-md px-4 py-1.5 rounded-full border border-amber-500/20 pointer-events-none shadow-lg">
            ✨ คลิกที่กระทงในแม่น้ำเพื่ออ่านคำอธิษฐาน | กดปุ่มด้านล่างเพื่อสร้างกระทงของคุณ
        </div>

        <!-- Dynamic Krathongs will float here -->
        <div id="krathongContainer" class="absolute inset-0 pointer-events-auto"></div>
    </main>

    <!-- BOTTOM FLOATING ACTION BAR -->
    <footer class="fixed bottom-4 left-0 right-0 z-40 flex justify-center px-4 pointer-events-none">
        <div class="pointer-events-auto flex items-center gap-3 bg-slate-900/80 backdrop-blur-xl border border-amber-500/30 p-2 md:p-2.5 rounded-2xl shadow-2xl shadow-amber-950/50">
            <button id="btnOpenCreateModal" class="px-6 md:px-8 py-3 rounded-xl bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-slate-950 font-bold text-sm md:text-base shadow-lg shadow-amber-500/40 hover:shadow-amber-400/60 hover:scale-[1.02] active:scale-95 transition-all flex items-center gap-2.5">
                <span class="text-xl">🪷</span>
                <span class="tracking-wide">สร้างกระทงและขอพร</span>
                <i class="fa-solid fa-arrow-right text-xs opacity-75"></i>
            </button>
            <button id="btnQuickBlessing" class="px-4 py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-amber-200 text-xs md:text-sm border border-white/10 hover:border-amber-400/40 transition flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                <span class="hidden sm:inline">สุ่มขอพรด่วน</span>
            </button>
        </div>
    </footer>

    <!-- MODAL 1: CREATE KRATHONG FORM -->
    <div id="createModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
        <div class="relative w-full max-w-xl bg-gradient-to-b from-slate-900 to-slate-950 border border-amber-500/40 rounded-3xl p-5 md:p-7 shadow-2xl shadow-amber-900/30 overflow-hidden max-h-[90vh] flex flex-col">
            <!-- Modal decorative light -->
            <div class="absolute -top-16 -right-16 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-3 border-b border-white/10">
                <div class="flex items-center gap-2.5">
                    <span class="text-2xl">🪷</span>
                    <div>
                        <h2 class="text-lg md:text-xl font-bold text-amber-300">ประดิษฐ์กระทงอธิษฐาน</h2>
                        <p class="text-xs text-slate-400">เลือกกระทงและเขียนคำขอขมาพระแม่คงคา</p>
                    </div>
                </div>
                <button id="btnCloseCreateModal" class="w-8 h-8 rounded-full bg-slate-800/80 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Body (Scrollable) -->
            <div class="overflow-y-auto py-4 space-y-4 pr-1">
                <!-- 1. Krathong Type Selection -->
                <div>
                    <label class="block text-xs font-semibold text-amber-300/90 mb-2">1. เลือกรูปแบบกระทง</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5" id="krathongTypeSelector">
                        <!-- Option 1: Banana Leaf -->
                        <div data-type="banana" class="krathong-opt cursor-pointer p-2.5 rounded-xl border-2 border-amber-400 bg-amber-500/10 flex flex-col items-center text-center transition hover:scale-[1.02]">
                            <div class="w-16 h-16 flex items-center justify-center" id="preview-banana"></div>
                            <span class="text-xs font-medium text-amber-200 mt-1">ใบตองดั้งเดิม</span>
                            <span class="text-[10px] text-slate-400">วิถีไทยโบราณ</span>
                        </div>
                        <!-- Option 2: Pink Lotus -->
                        <div data-type="lotus" class="krathong-opt cursor-pointer p-2.5 rounded-xl border border-white/10 bg-slate-800/40 flex flex-col items-center text-center transition hover:scale-[1.02]">
                            <div class="w-16 h-16 flex items-center justify-center" id="preview-lotus"></div>
                            <span class="text-xs font-medium text-slate-300 mt-1">กลีบบัวชมพู</span>
                            <span class="text-[10px] text-slate-400">บริสุทธิ์งดงาม</span>
                        </div>
                        <!-- Option 3: Colorful Floral -->
                        <div data-type="flower" class="krathong-opt cursor-pointer p-2.5 rounded-xl border border-white/10 bg-slate-800/40 flex flex-col items-center text-center transition hover:scale-[1.02]">
                            <div class="w-16 h-16 flex items-center justify-center" id="preview-flower"></div>
                            <span class="text-xs font-medium text-slate-300 mt-1">บุปผาหลากสี</span>
                            <span class="text-[10px] text-slate-400">สดใสเบิกบาน</span>
                        </div>
                        <!-- Option 4: Eco Ice -->
                        <div data-type="ice" class="krathong-opt cursor-pointer p-2.5 rounded-xl border border-white/10 bg-slate-800/40 flex flex-col items-center text-center transition hover:scale-[1.02]">
                            <div class="w-16 h-16 flex items-center justify-center" id="preview-ice"></div>
                            <span class="text-xs font-medium text-slate-300 mt-1">กระทงน้ำแข็ง</span>
                            <span class="text-[10px] text-slate-400">รักษ์โลก 100%</span>
                        </div>
                    </div>
                </div>

                <!-- 2. Name input -->
                <div>
                    <label class="block text-xs font-semibold text-amber-300/90 mb-1.5" for="inputName">2. ชื่อของคุณ / ครอบครัว</label>
                    <input type="text" id="inputName" placeholder="เช่น ชัยวัฒน์ และครอบครัว, น้องน้ำใส..." maxlength="40" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-white/15 focus:border-amber-400 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-amber-400 transition">
                </div>

                <!-- 3. Prayer / Wish Text Area -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-xs font-semibold text-amber-300/90" for="inputWish">3. คำอธิษฐาน / ข้อความขอขมา</label>
                        <span id="charCount" class="text-[10px] text-slate-400">0/150</span>
                    </div>
                    <textarea id="inputWish" rows="3" maxlength="150" placeholder="ขอขมาพระแม่คงคา และขอให้ชีวิตมีแต่ความร่มเย็นเป็นสุข ไร้โรคภัย..." class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-white/15 focus:border-amber-400 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-amber-400 transition resize-none"></textarea>
                </div>

                <!-- 4. Quick Wish Presets -->
                <div>
                    <span class="text-[11px] text-slate-400 block mb-2">💡 แนะนำคำอธิษฐานยอดนิยม (คลิกเพื่อเลือก):</span>
                    <div class="flex flex-wrap gap-1.5">
                        <button type="button" class="preset-tag text-[11px] px-2.5 py-1 bg-slate-800 hover:bg-amber-600/30 hover:text-amber-200 border border-white/10 rounded-lg text-slate-300 transition">
                            🌊 ขอขมาพระแม่คงคา
                        </button>
                        <button type="button" class="preset-tag text-[11px] px-2.5 py-1 bg-slate-800 hover:bg-amber-600/30 hover:text-amber-200 border border-white/10 rounded-lg text-slate-300 transition">
                            💼 การงานก้าวหน้า ค้าขายร่ำรวย
                        </button>
                        <button type="button" class="preset-tag text-[11px] px-2.5 py-1 bg-slate-800 hover:bg-amber-600/30 hover:text-amber-200 border border-white/10 rounded-lg text-slate-300 transition">
                            💖 พบเจอความรักที่ดี สมหวัง
                        </button>
                        <button type="button" class="preset-tag text-[11px] px-2.5 py-1 bg-slate-800 hover:bg-amber-600/30 hover:text-amber-200 border border-white/10 rounded-lg text-slate-300 transition">
                            🎓 เรียนเก่ง สอบผ่านทุกวิชา
                        </button>
                        <button type="button" class="preset-tag text-[11px] px-2.5 py-1 bg-slate-800 hover:bg-amber-600/30 hover:text-amber-200 border border-white/10 rounded-lg text-slate-300 transition">
                            🌿 สุขภาพแข็งแรง ไร้โรคภัย
                        </button>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="pt-3 border-t border-white/10 flex items-center justify-end gap-3">
                <button id="btnCancelCreate" class="px-4 py-2.5 rounded-xl text-slate-400 hover:text-white text-xs font-medium transition">
                    ยกเลิก
                </button>
                <button id="btnSubmitKrathong" class="px-6 py-2.5 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-bold text-sm rounded-xl shadow-lg shadow-amber-500/30 active:scale-95 transition flex items-center gap-2">
                    <i class="fa-solid fa-water"></i>
                    <span>ลอยกระทงลงสู่แม่น้ำ</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: VIEW WISH DETAIL MODAL -->
    <div id="viewWishModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
        <div class="relative w-full max-w-md bg-gradient-to-b from-slate-900 to-slate-950 border border-amber-500/40 rounded-3xl p-6 shadow-2xl text-center">
            <div class="w-16 h-16 mx-auto mb-3 flex items-center justify-center" id="viewWishKrathongIcon"></div>
            <h3 id="viewWishName" class="text-lg font-bold text-amber-300 mb-1">ชัยวัฒน์</h3>
            <p class="text-[11px] text-slate-400 mb-4" id="viewWishTime">ลอยเมื่อสักครู่</p>
            
            <div class="bg-slate-950/60 border border-white/10 p-4 rounded-2xl mb-5 text-left">
                <p class="text-xs text-amber-200/80 font-medium mb-1">คำอธิษฐาน:</p>
                <p id="viewWishText" class="text-sm text-slate-200 leading-relaxed font-handwriting">
                    "ขอขมาพระแม่คงคา และขอให้ครอบครัวมีแต่ความสุขความเจริญ"
                </p>
            </div>

            <div class="flex justify-center gap-2">
                <button id="btnSadhu" class="px-5 py-2 bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-semibold text-xs rounded-xl shadow-md transition active:scale-95 flex items-center gap-1.5">
                    🙏 ร่วมอนุโมทนา สาธุ (<span id="sadhuCount">0</span>)
                </button>
                <button id="btnCloseViewWish" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl hover:bg-slate-700 transition">
                    ปิด
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL 3: BLESSING CARD SHARE (POST-FLOAT) -->
    <div id="shareCardModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
        <div class="relative w-full max-w-sm bg-slate-900 border border-amber-400/50 rounded-3xl p-6 shadow-2xl text-center flex flex-col items-center">
            <span class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-0.5 rounded-full mb-3">
                ✨ ลอยกระทงสำเร็จแล้ว
            </span>

            <!-- The Beautiful Digital Blessing Card -->
            <div id="blessingCardBox" class="w-full bg-gradient-to-b from-indigo-950 via-slate-900 to-slate-950 border border-amber-300/40 p-5 rounded-2xl shadow-xl relative overflow-hidden mb-4">
                <div class="absolute top-2 right-2 text-xl opacity-60">🌕</div>
                <div class="w-20 h-20 mx-auto my-2 flex items-center justify-center" id="shareCardKrathongSvg"></div>
                <h4 id="shareCardName" class="font-bold text-amber-300 text-base mb-1">ชื่อผู้ขอพร</h4>
                <div class="w-12 h-[1px] bg-amber-400/40 mx-auto my-2"></div>
                <p id="shareCardWish" class="text-xs text-slate-200 italic font-handwriting leading-relaxed px-2 py-1">
                    "คำอธิษฐานของคุณจะนำพาสิ่งดีๆ ตลอดทั้งปี"
                </p>
                <p class="text-[10px] text-amber-300/60 mt-3 tracking-widest font-mono">LOY KRATHONG 2026</p>
            </div>

            <div class="flex items-center gap-2 w-full">
                <button id="btnCopyWish" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 border border-white/10 rounded-xl text-xs font-medium text-slate-200 transition flex items-center justify-center gap-1.5">
                    <i class="fa-regular fa-copy"></i>
                    <span>คัดลอกคำอวยพร</span>
                </button>
