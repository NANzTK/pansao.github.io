        // Render preview thumbnails in create modal
        document.getElementById('preview-banana').innerHTML = KRATHONG_SVGS.banana;
        document.getElementById('preview-lotus').innerHTML = KRATHONG_SVGS.lotus;
        document.getElementById('preview-flower').innerHTML = KRATHONG_SVGS.flower;
        document.getElementById('preview-ice').innerHTML = KRATHONG_SVGS.ice;

        /* ============================================================
           2. AUDIO SYNTHESIZER (Web Audio API - No external files)
        ============================================================ */
        class ThaiAmbianceAudio {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.pentatonicScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33]; // C, D, E, G, A Thai chime scale
                this.melodyTimer = null;
                this.waterNode = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            toggle() {
                this.init();
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                if (this.isPlaying) {
                    this.stop();
                    return false;
                } else {
                    this.start();
                    return true;
                }
            }

            start() {
                this.isPlaying = true;
                // 1. Water River Flow Ambient (Filtered Pink-ish noise)
                this.startWaterAmbient();
                // 2. Gentle Thai Khim / Bell Chimes
                this.playChimeLoop();
            }

            stop() {
                this.isPlaying = false;
                if (this.waterNode) {
                    try { this.waterNode.stop(); } catch(e) {}
                    this.waterNode = null;
                }
                clearTimeout(this.melodyTimer);
            }

            startWaterAmbient() {
                if (!this.ctx) return;
                const bufferSize = 2 * this.ctx.sampleRate;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(320, this.ctx.currentTime);

                const gainNode = this.ctx.createGain();
                gainNode.gain.setValueAtTime(0.04, this.ctx.currentTime);

                whiteNoise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(this.ctx.destination);

                whiteNoise.start();
                this.waterNode = whiteNoise;
            }

            playKhimTone(freq) {
                if (!this.isPlaying || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 2.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 2.5);
            }

            playChimeLoop() {
                if (!this.isPlaying) return;
                const randomNote = this.pentatonicScale[Math.floor(Math.random() * this.pentatonicScale.length)];
                this.playKhimTone(randomNote);

                const nextDelay = 1800 + Math.random() * 2500;
                this.melodyTimer = setTimeout(() => this.playChimeLoop(), nextDelay);
            }

            playSplash() {
                if (!this.ctx) this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                // Gentle water plop sound
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.35);

                gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }
        }

        const audio = new ThaiAmbianceAudio();

        /* ============================================================
           3. BACKGROUND VISUALS: SKY CANVAS (Stars, Firework, Lanterns)
        ============================================================ */
        const skyCanvas = document.getElementById('skyCanvas');
        const skyCtx = skyCanvas.getContext('2d');

        let skyW = (skyCanvas.width = window.innerWidth);
        let skyH = (skyCanvas.height = window.innerHeight);

        // Stars
        const stars = [];
        for (let i = 0; i < 90; i++) {
            stars.push({
                x: Math.random() * skyW,
                y: Math.random() * (skyH * 0.6),
                r: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.7 + 0.3,
                speed: Math.random() * 0.02 + 0.005
            });
        }

        // Sky Lanterns (Kom Loy)
        const lanterns = [];
        function createLantern(customX) {
            lanterns.push({
                x: customX !== undefined ? customX : Math.random() * skyW,
                y: skyH + 20,
                speedY: Math.random() * 0.8 + 0.5,
                speedX: (Math.random() - 0.5) * 0.4 + 0.15,
                size: Math.random() * 10 + 12,
                opacity: 0.95,
                flicker: Math.random() * 0.2
            });
        }
        // Initial ambient lanterns
        for (let i = 0; i < 7; i++) {
            const l = {
                x: Math.random() * skyW,
                y: Math.random() * skyH * 0.8,
                speedY: Math.random() * 0.6 + 0.4,
                speedX: (Math.random() - 0.5) * 0.3 + 0.1,
                size: Math.random() * 8 + 8,
                opacity: 0.8,
                flicker: 0.1
            };
            lanterns.push(l);
        }

        // Fireworks Particles
        let fireworkParticles = [];
        function launchFirework(x, y) {
            const colors = ['#f59e0b', '#fbbf24', '#ec4899', '#38bdf8', '#a855f7', '#34d399'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const particleCount = 45;

            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                const speed = Math.random() * 4 + 2;
                fireworkParticles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015,
                    size: Math.random() * 2.5 + 1.5
                });
            }
        }

        /* ============================================================
           4. WATER WAVES REFLECTION CANVAS
        ============================================================ */
        const waterCanvas = document.getElementById('waterCanvas');
        const waterCtx = waterCanvas.getContext('2d');
        let waveOffset = 0;

        function renderWaterWaves() {
            waterCtx.clearRect(0, 0, skyW, skyH);
            const riverTop = skyH * 0.42; // River horizon line

            // River Water Gradient fill
            const riverGrad = waterCtx.createLinearGradient(0, riverTop, 0, skyH);
            riverGrad.addColorStop(0, 'rgba(8, 20, 48, 0.7)');
            riverGrad.addColorStop(0.5, 'rgba(5, 14, 34, 0.85)');
            riverGrad.addColorStop(1, 'rgba(2, 6, 18, 0.96)');
            waterCtx.fillStyle = riverGrad;
            waterCtx.fillRect(0, riverTop, skyW, skyH - riverTop);

            // Shimmering Golden Moonlight Reflections in water
            const moonX = skyW * 0.82;
            const moonReflectGrad = waterCtx.createRadialGradient(moonX, riverTop + 40, 10, moonX, skyH * 0.8, skyW * 0.35);
            moonReflectGrad.addColorStop(0, 'rgba(255, 230, 150, 0.18)');
            moonReflectGrad.addColorStop(0.5, 'rgba(255, 200, 100, 0.06)');
            moonReflectGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            waterCtx.fillStyle = moonReflectGrad;
            waterCtx.fillRect(0, riverTop, skyW, skyH - riverTop);

            // Animated Horizontal Ripple Lines
            waveOffset += 0.02;
            const waveLines = 22;
            for (let i = 0; i < waveLines; i++) {
                const y = riverTop + ((skyH - riverTop) / waveLines) * i;
                const waveScale = (i / waveLines); // Waves grow wider closer to bottom
                const amp = 3 + waveScale * 7;
                
                waterCtx.beginPath();
                waterCtx.strokeStyle = `rgba(180, 220, 255, ${0.03 + waveScale * 0.08})`;
                waterCtx.lineWidth = 1 + waveScale * 1.5;

                for (let x = 0; x <= skyW; x += 30) {
                    const waveY = y + Math.sin(x * 0.015 + waveOffset + i) * amp;
                    if (x === 0) waterCtx.moveTo(x, waveY);
                    else waterCtx.lineTo(x, waveY);
                }
                waterCtx.stroke();
            }
        }

        /* Combined Sky & Background Render Loop */
        function animateBackground() {
            // Clear Sky
            skyCtx.clearRect(0, 0, skyW, skyH);

            // 1. Draw Stars
            stars.forEach(st => {
                st.alpha += Math.sin(Date.now() * st.speed) * 0.02;
                st.alpha = Math.max(0.2, Math.min(0.9, st.alpha));
                skyCtx.fillStyle = `rgba(255, 255, 255, ${st.alpha})`;
                skyCtx.beginPath();
                skyCtx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                skyCtx.fill();
            });

            // 2. Draw Sky Lanterns
            for (let i = lanterns.length - 1; i >= 0; i--) {
                const l = lanterns[i];
                l.y -= l.speedY;
                l.x += l.speedX;

                // Lantern glowing body
                const glowGrad = skyCtx.createRadialGradient(l.x, l.y, 2, l.x, l.y, l.size * 1.8);
                glowGrad.addColorStop(0, `rgba(255, 240, 180, ${l.opacity})`);
                glowGrad.addColorStop(0.4, `rgba(255, 140, 30, ${l.opacity * 0.8})`);
                glowGrad.addColorStop(1, 'rgba(255, 100, 10, 0)');

                skyCtx.fillStyle = glowGrad;
                skyCtx.beginPath();
                skyCtx.arc(l.x, l.y, l.size * 1.8, 0, Math.PI * 2);
                skyCtx.fill();

                // Lantern cylinder shape
                skyCtx.fillStyle = `rgba(255, 210, 120, ${l.opacity * 0.9})`;
                skyCtx.fillRect(l.x - l.size * 0.4, l.y - l.size * 0.6, l.size * 0.8, l.size * 1.1);

                // Hot flame base
                skyCtx.fillStyle = `rgba(255, 255, 255, ${l.opacity})`;
                skyCtx.fillRect(l.x - l.size * 0.15, l.y + l.size * 0.35, l.size * 0.3, l.size * 0.2);

                if (l.y < -50 || l.x < -50 || l.x > skyW + 50) {
                    lanterns.splice(i, 1);
                }
            }

            // 3. Draw Fireworks
            for (let i = fireworkParticles.length - 1; i >= 0; i--) {
                const p = fireworkParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05; // Gravity
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    fireworkParticles.splice(i, 1);
                    continue;
                }

                skyCtx.fillStyle = p.color;
                skyCtx.globalAlpha = p.alpha;
                skyCtx.beginPath();
                skyCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                skyCtx.fill();
                skyCtx.globalAlpha = 1;
            }

            // 4. Draw Animated Water
            renderWaterWaves();

            requestAnimationFrame(animateBackground);
        }

        /* Resize canvas listeners */
        window.addEventListener('resize', () => {
            skyW = skyCanvas.width = window.innerWidth;
            skyH = skyCanvas.height = window.innerHeight;
            waterCanvas.width = skyW;
            waterCanvas.height = skyH;
        });

        /* ============================================================
           5. KRATHONG DOM SYSTEM & RIVER LOGIC
        ============================================================ */
        const riverArea = document.getElementById('riverArea');
        const krathongContainer = document.getElementById('krathongContainer');
        const krathongCountBadge = document.getElementById('krathongCountBadge');

        // Active floating krathongs
        let activeKrathongs = [];

        // Sample preset wishes for quick population
        const sampleWishes = [
            { name: "คุณแม่สมศรี", wish: "ขอขมาพระแม่คงคา ขอให้ลูกหลานทุกคนมีสุขภาพพลานามัยแข็งแรง ปลอดภัย", type: "banana" },
            { name: "ธนกฤต & พิมพา", wish: "ขอให้ความรักยืนยาว มั่นคง ร่วมทุกข์ร่วมสุขไปด้วยกันตลอดไป", type: "lotus" },
            { name: "น้องน้ำมนต์", wish: "ขอให้สอบติดคณะที่ฝัน เกรดเฉลี่ยเทอมนี้ 3.8 ขึ้นไป สาธุ!", type: "flower" },
            { name: "ชมรมรักษ์สิ่งแวดล้อม", wish: "ขอขมาสายน้ำที่เราได้ใช้ประโยชน์ ขอให้ธรรมชาติฟื้นฟูงดงาม", type: "ice" },
            { name: "วิชัย สุขเจริญ", wish: "ขอให้กิจการค้าขายเจริญรุ่งเรือง ปลดหนี้ มีโชคลาภตลอดปี", type: "banana" }
        ];

        class KrathongItem {
            constructor(data) {
                this.id = 'k-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
                this.name = data.name || "ผู้ไม่ประสงค์ออกนาม";
                this.wish = data.wish || "ขอขมาพระแม่คงคา และขอให้มีแต่ความสุขความเจริญ";
                this.type = data.type || "banana";
                this.sadhu = 0;
                this.createdTime = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                // Position & Perspective
                // Closer to bottom = larger scale & faster float
                const depthRatio = 0.2 + Math.random() * 0.75; // 0.2 (far) to 0.95 (close)
                this.depth = depthRatio;
                this.scale = 0.6 + depthRatio * 0.65; // 0.6x to 1.25x scale
                
                // Vertical position corresponds to depth
                const containerH = riverArea.clientHeight;
                const minY = containerH * 0.25;
                const maxY = containerH * 0.82;
                this.y = minY + (maxY - minY) * depthRatio;

                // Horizontal movement
                // Spawn slightly offscreen left or at a random x
                this.x = data.initialX !== undefined ? data.initialX : -120;
                this.speed = (0.35 + depthRatio * 0.55) * (0.85 + Math.random() * 0.3);

                // Wave rocking physics
                this.waveAngle = Math.random() * Math.PI * 2;
                this.rockSpeed = 0.03 + Math.random() * 0.02;

                // Create DOM Element
                this.el = document.createElement('div');
                this.el.className = 'absolute cursor-pointer transform -translate-x-1/2 -translate-y-1/2 transition-transform duration-75 select-none hover:z-50';
                this.el.style.zIndex = Math.floor(depthRatio * 100);

                // HTML structure with SVG & floating Name tag
                this.el.innerHTML = `
                    <div class="relative flex flex-col items-center group">
                        <!-- Floating Name & Wish preview tag -->
                        <div class="mb-1 bg-slate-900/85 backdrop-blur-md px-2.5 py-1 rounded-full border border-amber-400/40 text-[11px] text-amber-200 whitespace-nowrap shadow-lg flex items-center gap-1.5 transition-all group-hover:scale-110 group-hover:border-amber-300">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span class="font-medium max-w-[120px] truncate">${escapeHtml(this.name)}</span>
                        </div>
                        
                        <!-- Krathong SVG Asset -->
                        <div class="krathong-graphic-box w-28 md:w-36 transition-transform group-hover:scale-105">
                            ${KRATHONG_SVGS[this.type] || KRATHONG_SVGS.banana}
                        </div>

                        <!-- Water Ripple Halo Effect under Krathong -->
                        <div class="absolute -bottom-2 w-28 h-6 bg-cyan-400/15 rounded-full blur-[4px] pointer-events-none -z-10 animate-pulse"></div>
                    </div>
                `;

                // Click to view wish detail modal
                this.el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openWishDetailModal(this);
                });

                krathongContainer.appendChild(this.el);
            }

            update(width) {
                this.x += this.speed;
                this.waveAngle += this.rockSpeed;

                // Bobbing vertical and slight tilt
                const bobY = Math.sin(this.waveAngle) * (3 * this.scale);
                const tiltDeg = Math.sin(this.waveAngle) * 3;

                this.el.style.transform = `translate3d(${this.x}px, ${this.y + bobY}px, 0) scale(${this.scale}) rotate(${tiltDeg}deg)`;

                // Out of screen right
                return this.x > width + 140;
            }

            destroy() {
                if (this.el && this.el.parentNode) {
                    this.el.parentNode.removeChild(this.el);
                }
            }
        }

        // Helper to escape HTML tags
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Add a new krathong to active list
        function spawnKrathong(data) {
            const k = new KrathongItem(data);
            activeKrathongs.push(k);
            updateKrathongCount();
            return k;
        }

        function updateKrathongCount() {
            krathongCountBadge.textContent = activeKrathongs.length;
        }

        // Populate initial river with some Krathongs across screen
        function seedInitialRiver() {
            const screenW = window.innerWidth;
            sampleWishes.forEach((item, index) => {
                spawnKrathong({
                    name: item.name,
                    wish: item.wish,
                    type: item.type,
                    initialX: (screenW / sampleWishes.length) * index + 40
                });
            });
        }

        // Main animation loop for floating Krathongs
        function updateKrathongs() {
            const w = riverArea.clientWidth;
            for (let i = activeKrathongs.length - 1; i >= 0; i--) {
                const k = activeKrathongs[i];
                const isOutOfScreen = k.update(w);
                if (isOutOfScreen) {
                    k.destroy();
                    activeKrathongs.splice(i, 1);
                    updateKrathongCount();

                    // Occasionally re-spawn a gentle background wish from the left
                    const randomSample = sampleWishes[Math.floor(Math.random() * sampleWishes.length)];
                    setTimeout(() => {
                        spawnKrathong({
                            name: randomSample.name,
                            wish: randomSample.wish,
                            type: randomSample.type,
                            initialX: -130
                        });
                    }, Math.random() * 3000 + 1000);
                }
            }
            requestAnimationFrame(updateKrathongs);
        }

        /* ============================================================
           6. MODAL CONTROLS & INTERACTIONS
        ============================================================ */
        const createModal = document.getElementById('createModal');
        const btnOpenCreateModal = document.getElementById('btnOpenCreateModal');
        const btnCloseCreateModal = document.getElementById('btnCloseCreateModal');
        const btnCancelCreate = document.getElementById('btnCancelCreate');
        const btnSubmitKrathong = document.getElementById('btnSubmitKrathong');
        const inputName = document.getElementById('inputName');
        const inputWish = document.getElementById('inputWish');
        const charCount = document.getElementById('charCount');

        let selectedType = 'banana';

        function showModal(modal) {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
        }

        function hideModal(modal) {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
        }

        btnOpenCreateModal.addEventListener('click', () => {
            showModal(createModal);
            inputName.focus();
        });

        [btnCloseCreateModal, btnCancelCreate].forEach(btn => {
            btn.addEventListener('click', () => hideModal(createModal));
        });

        // Krathong Type selection highlight
        const typeOptions = document.querySelectorAll('.krathong-opt');
        typeOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                typeOptions.forEach(o => {
                    o.classList.remove('border-2', 'border-amber-400', 'bg-amber-500/10');
                    o.classList.add('border', 'border-white/10', 'bg-slate-800/40');
                });
                opt.classList.remove('border', 'border-white/10', 'bg-slate-800/40');
                opt.classList.add('border-2', 'border-amber-400', 'bg-amber-500/10');
                selectedType = opt.getAttribute('data-type');
            });
        });

        // Character counter
        inputWish.addEventListener('input', () => {
            charCount.textContent = `${inputWish.value.length}/150`;
        });

        // Preset wish buttons
        document.querySelectorAll('.preset-tag').forEach(tag => {
            tag.addEventListener('click', () => {
                inputWish.value = tag.textContent.trim();
                charCount.textContent = `${inputWish.value.length}/150`;
            });
        });

        // SUBMIT KRATHONG EVENT
        btnSubmitKrathong.addEventListener('click', () => {
            const userName = inputName.value.trim() || "กัลยาณมิตรผู้ใจบุญ";
            const userWish = inputWish.value.trim() || "ขอขมาพระแม่คงคา ขอให้พบเจอแต่ความสุข ความเจริญรุ่งเรือง";

            // Hide form modal
            hideModal(createModal);

            // Play sound effect & Launch celebratory fireworks
            audio.playSplash();
            const launchX = window.innerWidth * 0.4 + Math.random() * (window.innerWidth * 0.2);
            launchFirework(launchX, window.innerHeight * 0.3);
            setTimeout(() => {
                launchFirework(launchX - 100, window.innerHeight * 0.24);
                launchFirework(launchX + 110, window.innerHeight * 0.26);
            }, 300);

            // Also launch a lantern celebrating this Krathong
            createLantern(launchX);

            // Add Krathong to River starting from left/center view
            const newK = spawnKrathong({
                name: userName,
                wish: userWish,
                type: selectedType,
                initialX: 60
            });

            // Show congratulatory share card
            openShareCard(userName, userWish, selectedType);

            // Reset Form fields
            inputName.value = '';
            inputWish.value = '';
            charCount.textContent = '0/150';
        });

        // QUICK BLESSING BUTTON
        document.getElementById('btnQuickBlessing').addEventListener('click', () => {
            const randomSample = sampleWishes[Math.floor(Math.random() * sampleWishes.length)];
            const types = ['banana', 'lotus', 'flower', 'ice'];
            const randType = types[Math.floor(Math.random() * types.length)];
            
            audio.playSplash();
            launchFirework(window.innerWidth * 0.5, window.innerHeight * 0.35);

            spawnKrathong({
                name: randomSample.name,
                wish: randomSample.wish,
                type: randType,
                initialX: 30
            });
        });

        /* ============================================================
           7. VIEW WISH DETAILS MODAL (When clicking on floating Krathong)
        ============================================================ */
        const viewWishModal = document.getElementById('viewWishModal');
        const viewWishName = document.getElementById('viewWishName');
        const viewWishTime = document.getElementById('viewWishTime');
        const viewWishText = document.getElementById('viewWishText');
        const viewWishKrathongIcon = document.getElementById('viewWishKrathongIcon');
        const sadhuCountSpan = document.getElementById('sadhuCount');
        const btnSadhu = document.getElementById('btnSadhu');
        const btnCloseViewWish = document.getElementById('btnCloseViewWish');

        let currentActiveItem = null;

        function openWishDetailModal(item) {
            currentActiveItem = item;
            viewWishName.textContent = item.name;
            viewWishTime.textContent = `ลอยเมื่อเวลา ${item.createdTime} น.`;
            viewWishText.textContent = `"${item.wish}"`;
            viewWishKrathongIcon.innerHTML = KRATHONG_SVGS[item.type] || KRATHONG_SVGS.banana;
            sadhuCountSpan.textContent = item.sadhu;
            showModal(viewWishModal);
        }

        btnCloseViewWish.addEventListener('click', () => hideModal(viewWishModal));

        btnSadhu.addEventListener('click', () => {
            if (currentActiveItem) {
                currentActiveItem.sadhu++;
                sadhuCountSpan.textContent = currentActiveItem.sadhu;
                // Launch a tiny sparkling firework
                launchFirework(window.innerWidth * 0.5, window.innerHeight * 0.45);
            }
        });

        /* ============================================================
           8. CELEBRATION SHARE CARD MODAL
        ============================================================ */
        const shareCardModal = document.getElementById('shareCardModal');
        const shareCardName = document.getElementById('shareCardName');
        const shareCardWish = document.getElementById('shareCardWish');
        const shareCardKrathongSvg = document.getElementById('shareCardKrathongSvg');
        const btnCloseShareCard = document.getElementById('btnCloseShareCard');
        const btnCopyWish = document.getElementById('btnCopyWish');
        const copyAlertToast = document.getElementById('copyAlertToast');

        function openShareCard(name, wish, type) {
            shareCardName.textContent = name;
            shareCardWish.textContent = `"${wish}"`;
            shareCardKrathongSvg.innerHTML = KRATHONG_SVGS[type] || KRATHONG_SVGS.banana;
            showModal(shareCardModal);
        }

        btnCloseShareCard.addEventListener('click', () => hideModal(shareCardModal));

        btnCopyWish.addEventListener('click', () => {
            const textToCopy = `ลอยกระทงออนไลน์ 2569\nผู้ขอพร: ${shareCardName.textContent}\nคำอธิษฐาน: ${shareCardWish.textContent}\nขอขมาพระแม่คงคา ร่วมอนุโมทนาบุญด้วยกันครับ/ค่ะ 🙏`;
            
            // Clipboard fallback as specified
            const tempInput = document.createElement("textarea");
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                copyAlertToast.classList.remove('opacity-0');
                setTimeout(() => copyAlertToast.classList.add('opacity-0'), 2200);
            } catch (err) {
                console.error("Copy failed", err);
            }
            document.body.removeChild(tempInput);
        });

        /* ============================================================
           9. EXTRA CONTROLS (LANTERN, SOUND, OBS MODE)
        ============================================================ */
        // Release Lantern button
        document.getElementById('btnReleaseLantern').addEventListener('click', () => {
            createLantern(window.innerWidth * 0.2 + Math.random() * (window.innerWidth * 0.6));
            createLantern(window.innerWidth * 0.2 + Math.random() * (window.innerWidth * 0.6));
        });

        // Audio toggle button
        const btnToggleSound = document.getElementById('btnToggleSound');
        const soundIcon = document.getElementById('soundIcon');
        btnToggleSound.addEventListener('click', () => {
            const active = audio.toggle();
            if (active) {
                soundIcon.className = "fa-solid fa-volume-high text-amber-400";
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark";
            }
        });

        // OBS Transparent Screen Mode toggle
        const btnToggleOBS = document.getElementById('btnToggleOBS');
        btnToggleOBS.addEventListener('click', () => {
            document.body.classList.toggle('obs-mode');
            if (document.body.classList.contains('obs-mode')) {
                btnToggleOBS.classList.add('bg-emerald-600', 'text-white');
            } else {
                btnToggleOBS.classList.remove('bg-emerald-600', 'text-white');
            }
        });

        /* ============================================================
           10. START APPLICATION ON LOAD
        ============================================================ */
        window.onload = function() {
            // Start Canvas rendering loops
            animateBackground();

            // Populate initial Krathongs floating in river
            seedInitialRiver();

            // Start river animation physics
            updateKrathongs();

            // Auto spawn gentle lanterns into the sky periodically
            setInterval(() => {
                if (lanterns.length < 15) {
                    createLantern();
                }
            }, 3500);
        };
    </script>
</body>
</html>
